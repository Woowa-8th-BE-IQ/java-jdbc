plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.techcourse'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'com.h2database:h2:2.3.232'
    implementation 'org.testcontainers:mysql:1.21.3'

    implementation 'org.reflections:reflections:0.10.2'
    implementation 'ch.qos.logback:logback-classic:1.5.18'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.apache.commons:commons-compress:1.26.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.jboss.narayana.jta:narayana-jta:7.3.4.Final'
    testImplementation 'com.mysql:mysql-connector-j:9.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    maxParallelForks = 3
    useJUnitPlatform()
}

tasks.register('step5Test', Test) {
    description = '로컬 트랜잭션, 트랜잭션 관리자 추상화와 JTA/XA를 비교한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'transaction.stage5.*'
    }
    maxParallelForks = 1
}
